name: Button Poller

# Ловит нажатия кнопок без Termux/ПК.
# Ответ обычно в течение 1–5 минут.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore offset
        uses: actions/cache/restore@v4
        with:
          path: .tg_offset
          key: tg-offset-${{ github.run_id }}
          restore-keys: |
            tg-offset-

      - name: Process button presses
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEO_LAT: ${{ secrets.GEO_LAT }}
          GEO_LON: ${{ secrets.GEO_LON }}
          GEO_CITY: ${{ secrets.GEO_CITY }}
          GEO_LABEL: ${{ secrets.GEO_LABEL }}
          POLL: "1"
        run: python -u bot.py

      - name: Save offset
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .tg_offset
          key: tg-offset-${{ github.run_id }}
