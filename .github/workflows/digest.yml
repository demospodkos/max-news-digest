name: Telegram Digest

on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEO_LAT: ${{ secrets.GEO_LAT }}
          GEO_LON: ${{ secrets.GEO_LON }}
          GEO_CITY: ${{ secrets.GEO_CITY }}
          GEO_LABEL: ${{ secrets.GEO_LABEL }}
        run: python -u bot.py
